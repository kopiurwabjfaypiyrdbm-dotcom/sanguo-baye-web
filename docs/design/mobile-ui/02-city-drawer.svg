<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">城市情境抽屉概念稿</title>
  <desc id="desc">地图仍然可见，右侧抽屉展示许昌摘要、驻城武将和内政人事军事谋略入口。</desc>
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b332e"/><stop offset="1" stop-color="#0d1d1a"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1ead8"/><stop offset="1" stop-color="#d9cfb8"/></linearGradient>
    <pattern id="grid" width="82" height="72" patternUnits="userSpaceOnUse"><path d="M82 0H0V72" fill="none" stroke="#b8aa79" stroke-opacity=".08" stroke-width="2"/></pattern>
    <filter id="shadow"><feDropShadow dx="-12" dy="0" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#eee7d3}.ink{fill:#26382f}.sub{fill:#687269}.muted{fill:#9cab9f}.gold{fill:#efcf76}.small{font-size:18px}.body{font-size:21px}.label{font-size:24px;font-weight:700}.heading{font-size:36px;font-weight:700}.road{fill:none;stroke:#b7a66e;stroke-width:5;stroke-opacity:.36}.city{stroke:#f4ead0;stroke-width:4}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#mapbg)"/><rect y="78" width="1600" height="742" fill="url(#grid)"/>
  <path d="M-40 620C300 520 530 705 800 610S1200 520 1680 600" fill="none" stroke="#477d83" stroke-width="34" stroke-opacity=".45"/>
  <path class="road" d="M130 590L300 410L520 520L735 315L910 430L1120 340M520 520L760 650L1010 610"/>
  <g transform="translate(130 590)"><circle r="20" fill="#4676aa" class="city"/><text y="50" text-anchor="middle" class="label">成都</text></g>
  <g transform="translate(300 410)"><circle r="18" fill="#4676aa" class="city"/><text y="48" text-anchor="middle" class="label">汉中</text></g>
  <g transform="translate(520 520)"><circle r="18" fill="#4676aa" class="city"/><text y="48" text-anchor="middle" class="label">襄阳</text></g>
  <g transform="translate(735 315)"><circle r="18" fill="#667b69" class="city"/><text y="48" text-anchor="middle" class="label">洛阳</text></g>
  <g transform="translate(910 430)"><circle r="37" fill="#eacb73" opacity=".18" stroke="#eacb73" stroke-width="4"/><circle r="21" fill="#9f5a43" class="city"/><text y="56" text-anchor="middle" class="label">许昌</text></g>
  <g transform="translate(760 650)"><circle r="18" fill="#c3744c" class="city"/><text y="48" text-anchor="middle" class="label">江陵</text></g>

  <g><rect width="1600" height="78" fill="#1b302b"/><text x="32" y="31" class="small muted">经典校准 · 曹操</text><text x="32" y="61" class="label gold">190 年 2 月</text><text x="340" y="48" class="body">金 12,480　 粮 31,260　 兵 8,420　 在途 3</text><rect x="1370" y="10" width="200" height="58" rx="15" fill="#e4c46e"/><text x="1470" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#17241d">结束本月</text></g>

  <g transform="translate(1010 78)" filter="url(#shadow)">
    <rect width="590" height="742" fill="url(#paper)"/>
    <rect width="590" height="12" fill="#9f5a43"/>
    <g transform="translate(28 38)">
      <text class="sub small">CITY 18 · 己方城池</text><text y="50" class="ink heading">许昌</text>
      <rect x="400" y="0" width="132" height="46" rx="23" fill="#9f5a43"/><text x="466" y="30" text-anchor="middle" class="small">曹操军</text>
      <text y="88" class="sub body">太守 曹操　 状态 安定　 本月 3/7 人已行动</text>
    </g>
    <g transform="translate(28 150)">
      <rect width="534" height="150" rx="18" fill="#fbf7eb" stroke="#867b65" stroke-opacity=".35"/>
      <g transform="translate(22 20)"><text class="sub small">金钱</text><text y="31" class="ink label">3,480</text><text x="130" class="sub small">粮草</text><text x="130" y="31" class="ink label">8,260</text><text x="260" class="sub small">后备兵</text><text x="260" y="31" class="ink label">1,200</text><text x="408" class="sub small">城防</text><text x="408" y="31" class="ink label">74</text></g>
      <line x1="22" y1="76" x2="512" y2="76" stroke="#aa9e86" stroke-opacity=".45"/>
      <g transform="translate(22 96)"><text class="sub small">农业 68/100</text><rect y="20" width="105" height="9" rx="4" fill="#d8d0bd"/><rect y="20" width="71" height="9" rx="4" fill="#668464"/><text x="150" class="sub small">商业 52/100</text><rect x="150" y="20" width="105" height="9" rx="4" fill="#d8d0bd"/><rect x="150" y="20" width="55" height="9" rx="4" fill="#9c7c4f"/><text x="310" class="sub small">民忠 82</text><text x="420" class="sub small">防灾 45</text></g>
    </g>
    <g transform="translate(28 322)">
      <text class="ink label">驻城人物</text><text x="532" text-anchor="end" class="sub small">7 人　›</text>
      <g transform="translate(0 24)">
        <rect width="534" height="92" rx="15" fill="#e8dfca"/>
        <g transform="translate(16 14)"><circle cx="31" cy="31" r="31" fill="#344d42"/><text x="31" y="39" text-anchor="middle" font-size="24">曹</text><text x="76" y="25" class="ink label">曹操</text><text x="76" y="54" class="sub small">太守 · 体 100 · 兵 1,100</text><text x="410" y="25" class="ink small">武 72　智 96</text><text x="410" y="54" class="sub small">待命</text></g>
      </g>
    </g>
    <g transform="translate(28 472)">
      <text class="ink label">对这座城市做什么？</text>
      <g transform="translate(0 26)">
        <g><rect width="165" height="86" rx="17" fill="#355b4c"/><text x="82" y="36" text-anchor="middle" font-size="24">田</text><text x="82" y="68" text-anchor="middle" class="body">内政</text></g>
        <g transform="translate(184)"><rect width="165" height="86" rx="17" fill="#485f53"/><text x="82" y="36" text-anchor="middle" font-size="24">将</text><text x="82" y="68" text-anchor="middle" class="body">人事</text></g>
        <g transform="translate(368)"><rect width="165" height="86" rx="17" fill="#8b5544"/><text x="82" y="36" text-anchor="middle" font-size="24">兵</text><text x="82" y="68" text-anchor="middle" class="body">军事</text></g>
      </g>
      <g transform="translate(0 124)">
        <g><rect width="257" height="62" rx="15" fill="#6f5b3c"/><text x="128" y="39" text-anchor="middle" class="body">谋略</text></g>
        <g transform="translate(276)"><rect width="257" height="62" rx="15" fill="#d4c8ae" stroke="#9d9076"/><text x="128" y="39" text-anchor="middle" class="body ink">完整城情</text></g>
      </g>
    </g>
    <g transform="translate(28 700)"><text class="sub small">点击地图空白或向右滑动即可收起</text><text x="532" text-anchor="end" class="ink small">关闭　×</text></g>
  </g>

  <g transform="translate(0 820)"><rect width="1600" height="80" fill="#14231f"/><g transform="translate(410)"><text x="70" y="34" text-anchor="middle" font-size="26">▱</text><text x="70" y="68" text-anchor="middle" class="small gold">地图</text><text x="250" y="34" text-anchor="middle" font-size="26">旗</text><text x="250" y="68" text-anchor="middle" class="small">势力</text><text x="430" y="34" text-anchor="middle" font-size="26">将</text><text x="430" y="68" text-anchor="middle" class="small">人物</text><text x="610" y="34" text-anchor="middle" font-size="26">报</text><text x="610" y="68" text-anchor="middle" class="small">战报</text></g></g>
</svg>

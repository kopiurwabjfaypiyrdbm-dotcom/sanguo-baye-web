<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">手机横屏战略地图概念稿</title>
  <desc id="desc">战略地图占据主体，上方为紧凑资源栏，下方为全局导航，地图上显示城市、道路、河流和在途命令。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172d29"/><stop offset="1" stop-color="#0b1715"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#243e35"/><stop offset=".65" stop-color="#172b27"/><stop offset="1" stop-color="#29382f"/>
    </linearGradient>
    <pattern id="grid" width="86" height="76" patternUnits="userSpaceOnUse">
      <path d="M86 0H0V76" fill="none" stroke="#b8aa79" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#eee7d3} .muted{fill:#9eada3}.gold{fill:#efd27e}.small{font-size:18px}.label{font-size:22px;font-weight:700}.value{font-size:24px;font-weight:700}.city{stroke:#f4ead0;stroke-width:4}.road{stroke:#b7a66e;stroke-opacity:.42;stroke-width:5;fill:none}.river{stroke:#477d83;stroke-opacity:.48;stroke-width:34;fill:none}.riverline{stroke:#78a9aa;stroke-opacity:.34;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="78" width="1600" height="742" fill="url(#grid)"/>

  <path class="river" d="M-60 605 C260 530 430 700 730 626 S1200 490 1660 590"/>
  <path class="riverline" d="M-60 605 C260 530 430 700 730 626 S1200 490 1660 590"/>
  <path class="road" d="M155 580L295 433L505 320L745 315L905 432L1122 338L1360 455"/>
  <path class="road" d="M295 433L520 550L745 315M520 550L770 640L1010 606L1360 455M905 432L1010 606M1122 338L1360 455"/>
  <path class="road" d="M155 580L330 700L770 640"/>

  <g opacity=".55">
    <path d="M86 190l52-60 58 60zM116 213l68-76 72 76z" fill="#385247"/>
    <path d="M1180 190l64-70 74 70zM1265 205l55-60 70 60z" fill="#385247"/>
    <path d="M585 755l56-57 55 57zM650 760l62-68 70 68z" fill="#334d43"/>
  </g>

  <g transform="translate(155 580)"><circle r="21" fill="#4676aa" class="city"/><text y="52" text-anchor="middle" class="label">成都</text></g>
  <g transform="translate(295 433)"><circle r="19" fill="#4676aa" class="city"/><text y="50" text-anchor="middle" class="label">汉中</text></g>
  <g transform="translate(330 700)"><circle r="18" fill="#4676aa" class="city"/><text y="48" text-anchor="middle" class="label">江州</text></g>
  <g transform="translate(505 320)"><circle r="18" fill="#667b69" class="city"/><text y="48" text-anchor="middle" class="label">长安</text></g>
  <g transform="translate(520 550)"><circle r="18" fill="#4676aa" class="city"/><text y="48" text-anchor="middle" class="label">襄阳</text></g>
  <g transform="translate(745 315)">
    <circle r="34" fill="#efd27e" opacity=".17" stroke="#efd27e" stroke-width="4"/>
    <circle r="21" fill="#667b69" class="city"/>
    <text y="54" text-anchor="middle" class="label">洛阳</text>
  </g>
  <g transform="translate(905 432)"><circle r="19" fill="#667b69" class="city"/><text y="50" text-anchor="middle" class="label">许昌</text></g>
  <g transform="translate(770 640)"><circle r="18" fill="#c3744c" class="city"/><text y="48" text-anchor="middle" class="label">江陵</text></g>
  <g transform="translate(1010 606)"><circle r="18" fill="#c3744c" class="city"/><text y="48" text-anchor="middle" class="label">武昌</text></g>
  <g transform="translate(1122 338)"><circle r="18" fill="#667b69" class="city"/><text y="48" text-anchor="middle" class="label">陈留</text></g>
  <g transform="translate(1360 455)"><circle r="20" fill="#c3744c" class="city"/><text y="50" text-anchor="middle" class="label">建业</text></g>

  <g filter="url(#shadow)" transform="translate(715 172)">
    <rect width="330" height="78" rx="14" fill="#152923" stroke="#d7ba67" stroke-opacity=".65"/>
    <circle cx="38" cy="39" r="18" fill="#4676aa"/><path d="M55 39H90" stroke="#d7ba67" stroke-width="4" stroke-linecap="round"/>
    <text x="106" y="31" class="small gold">调动 · 2 月后到达</text>
    <text x="106" y="58" class="small">夏侯惇　洛阳 → 许昌</text>
  </g>

  <g transform="translate(1250 690)" filter="url(#shadow)">
    <rect width="300" height="94" rx="18" fill="#203c34" stroke="#708b7c"/>
    <text x="24" y="34" class="small muted">当前选择</text><text x="24" y="68" class="value">洛阳 · 中立</text>
    <rect x="210" y="22" width="66" height="50" rx="12" fill="#e4c46e"/><text x="243" y="54" text-anchor="middle" font-size="20" fill="#18251f">查看</text>
  </g>

  <g>
    <rect width="1600" height="78" fill="url(#top)"/>
    <text x="34" y="31" class="small muted">经典校准 · 曹操</text><text x="34" y="61" class="value gold">190 年 2 月</text>
    <g transform="translate(320 16)">
      <text x="0" y="20" class="small muted">金钱</text><text x="0" y="47" class="value">12,480</text>
      <text x="150" y="20" class="small muted">粮草</text><text x="150" y="47" class="value">31,260</text>
      <text x="300" y="20" class="small muted">兵力</text><text x="300" y="47" class="value">8,420</text>
      <text x="450" y="20" class="small muted">城池</text><text x="450" y="47" class="value">7 / 38</text>
      <text x="600" y="20" class="small muted">在途</text><text x="600" y="47" class="value gold">3 项</text>
    </g>
    <g transform="translate(1286 13)"><rect width="68" height="52" rx="13" fill="#314940" stroke="#60786c"/><text x="34" y="34" text-anchor="middle" font-size="22">全屏</text></g>
    <g transform="translate(1370 10)"><rect width="200" height="58" rx="15" fill="#e4c46e" stroke="#f4dda0"/><text x="100" y="37" text-anchor="middle" font-size="24" font-weight="700" fill="#17241d">结束本月</text></g>
  </g>

  <g transform="translate(0 820)">
    <rect width="1600" height="80" fill="#14231f" stroke="#d8c07a" stroke-opacity=".25"/>
    <g transform="translate(360 0)">
      <g><rect width="168" height="80" fill="#2f4b40"/><path d="M68 25h32v25H68zM72 21l12-9 12 9" fill="none" stroke="#efd27e" stroke-width="3"/><text x="84" y="70" text-anchor="middle" class="small gold">地图</text></g>
      <g transform="translate(178)"><text x="84" y="34" text-anchor="middle" font-size="27">旗</text><text x="84" y="70" text-anchor="middle" class="small">势力</text></g>
      <g transform="translate(356)"><text x="84" y="34" text-anchor="middle" font-size="27">将</text><text x="84" y="70" text-anchor="middle" class="small">人物</text></g>
      <g transform="translate(534)"><text x="84" y="34" text-anchor="middle" font-size="27">报</text><text x="84" y="70" text-anchor="middle" class="small">战报</text></g>
      <g transform="translate(712)"><text x="84" y="34" text-anchor="middle" font-size="27">⚙</text><text x="84" y="70" text-anchor="middle" class="small">系统</text></g>
    </g>
  </g>
</svg>

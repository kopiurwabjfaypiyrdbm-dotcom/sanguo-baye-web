<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">手机横屏手动战斗概念稿</title>
  <desc id="desc">战术地图占据主体，顶部显示回合和双方兵力，左侧为收起的队伍条，底部为当前武将动作栏，地图显示移动与攻击范围。</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#354f3e"/><stop offset=".6" stop-color="#243b32"/><stop offset="1" stop-color="#182b27"/></linearGradient>
    <pattern id="tiles" width="82" height="70" patternUnits="userSpaceOnUse"><path d="M82 0H0V70" fill="none" stroke="#e5d69c" stroke-opacity=".12" stroke-width="2"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".4"/></filter>
    <style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#eee7d3}.muted{fill:#a5b2a8}.gold{fill:#efd27e}.blue{fill:#8eb7d8}.small{font-size:18px}.body{font-size:21px}.label{font-size:24px;font-weight:700}.heading{font-size:30px;font-weight:700}.tile{stroke:#d8c98e;stroke-opacity:.18;stroke-width:2}.unit{stroke:#f3e6bd;stroke-width:4}</style>
  </defs>
  <rect width="1600" height="900" fill="#0d1917"/>
  <g transform="translate(0 76)">
    <rect width="1600" height="718" fill="url(#field)"/><rect width="1600" height="718" fill="url(#tiles)"/>
    <path d="M80 110C280 40 380 180 560 115S850 30 1040 110" fill="none" stroke="#6c7e5c" stroke-width="90" stroke-opacity=".35"/>
    <path d="M1040 22C1110 145 1060 245 1170 330S1420 430 1560 600" fill="none" stroke="#4d7a7f" stroke-width="44" stroke-opacity=".55"/>
    <g fill="#4c624a" opacity=".8"><path d="M170 235l55-72 64 72zM220 260l65-82 78 82zM1280 120l60-78 70 78zM1360 145l55-70 64 70z"/></g>
    <g fill="#22372f" stroke="#9b8c63" stroke-width="4"><path d="M1210 245h160v120h-160z"/><path d="M1190 245l100-72 100 72z"/><path d="M1235 365v70h110v-70"/></g><text x="1290" y="306" text-anchor="middle" class="label">陈留城</text>

    <g opacity=".85" fill="#4e8896"><rect x="360" y="360" width="82" height="70" class="tile"/><rect x="442" y="360" width="82" height="70" class="tile"/><rect x="524" y="360" width="82" height="70" class="tile"/><rect x="442" y="290" width="82" height="70" class="tile"/><rect x="442" y="430" width="82" height="70" class="tile"/></g>
    <g opacity=".9" fill="#a65a49"><rect x="606" y="360" width="82" height="70" class="tile"/><rect x="688" y="360" width="82" height="70" class="tile"/><rect x="606" y="290" width="82" height="70" class="tile"/></g>

    <g transform="translate(483 395)" filter="url(#shadow)"><circle r="34" fill="#3e79a6" class="unit"/><text y="7" text-anchor="middle" font-size="24">夏</text><rect x="-37" y="39" width="74" height="25" rx="8" fill="#14231f"/><text y="58" text-anchor="middle" class="small">1,328</text></g>
    <g transform="translate(332 525)"><circle r="29" fill="#3e79a6" class="unit"/><text y="7" text-anchor="middle" font-size="22">曹</text><rect x="-34" y="35" width="68" height="23" rx="8" fill="#14231f"/><text y="52" text-anchor="middle" font-size="16">1,080</text></g>
    <g transform="translate(662 325)"><circle r="31" fill="#a34f40" class="unit"/><text y="7" text-anchor="middle" font-size="22">张</text><rect x="-34" y="37" width="68" height="23" rx="8" fill="#14231f"/><text y="54" text-anchor="middle" font-size="16">920</text></g>
    <g transform="translate(920 278)"><circle r="29" fill="#a34f40" class="unit"/><text y="7" text-anchor="middle" font-size="22">李</text><rect x="-34" y="35" width="68" height="23" rx="8" fill="#14231f"/><text y="52" text-anchor="middle" font-size="16">610</text></g>

    <g transform="translate(1050 470)" filter="url(#shadow)"><rect width="400" height="142" rx="18" fill="#14251f" stroke="#d6bd74" stroke-opacity=".7"/><text x="20" y="32" class="small gold">当前武将</text><text x="20" y="68" class="heading">夏侯惇 · 骑兵</text><text x="20" y="103" class="small">兵 1,328　体 84　移动 5　普攻 四向近战</text><text x="20" y="130" class="small muted">青色可移动 · 红色可攻击</text></g>

    <g transform="translate(18 18)" filter="url(#shadow)">
      <rect width="88" height="408" rx="18" fill="#14251f" stroke="#60796d"/>
      <text x="44" y="35" text-anchor="middle" class="small gold">我军</text>
      <g transform="translate(44 83)"><circle r="28" fill="#3e79a6" stroke="#efd27e" stroke-width="4"/><text y="7" text-anchor="middle" font-size="20">夏</text><text y="48" text-anchor="middle" font-size="15">待命</text></g>
      <g transform="translate(44 172)"><circle r="26" fill="#3e79a6"/><text y="7" text-anchor="middle" font-size="20">曹</text><text y="47" text-anchor="middle" font-size="15">待命</text></g>
      <g transform="translate(44 261)"><circle r="26" fill="#3e79a6"/><text y="7" text-anchor="middle" font-size="20">荀</text><text y="47" text-anchor="middle" font-size="15">已动</text></g>
      <text x="44" y="382" text-anchor="middle" class="small">展开 ›</text>
    </g>
  </g>

  <g><rect width="1600" height="76" fill="#1b2e29"/><text x="28" y="31" class="small muted">盆地坚城 · 手动战斗</text><text x="28" y="60" class="label">许昌军进攻陈留</text><text x="500" y="47" class="body gold">第 3 日 · 我方阶段</text><text x="790" y="47" class="body blue">我军 3,128</text><text x="970" y="47" class="body">敌军 1,530</text><text x="1150" y="47" class="body">粮草 18 日</text><rect x="1370" y="12" width="96" height="52" rx="13" fill="#314840"/><text x="1418" y="46" text-anchor="middle" class="small">日志</text><rect x="1480" y="12" width="96" height="52" rx="13" fill="#71483e"/><text x="1528" y="46" text-anchor="middle" class="small">撤退</text></g>

  <g transform="translate(0 794)">
    <rect width="1600" height="106" fill="#162620" stroke="#d7c079" stroke-opacity=".28"/>
    <g transform="translate(180 16)">
      <rect width="190" height="74" rx="17" fill="#36584b" stroke="#efd27e" stroke-width="3"/><text x="95" y="31" text-anchor="middle" font-size="25">移动</text><text x="95" y="58" text-anchor="middle" class="small muted">选择蓝色格</text>
      <rect x="208" width="190" height="74" rx="17" fill="#8e4f40"/><text x="303" y="31" text-anchor="middle" font-size="25">普攻</text><text x="303" y="58" text-anchor="middle" class="small">2 个目标</text>
      <rect x="416" width="190" height="74" rx="17" fill="#6f5a3c"/><text x="511" y="31" text-anchor="middle" font-size="25">计谋</text><text x="511" y="58" text-anchor="middle" class="small">3 项可用</text>
      <rect x="624" width="190" height="74" rx="17" fill="#344840"/><text x="719" y="45" text-anchor="middle" font-size="25">待机</text>
      <rect x="832" width="190" height="74" rx="17" fill="#283a34" stroke="#5e7469"/><text x="927" y="45" text-anchor="middle" font-size="25">单位详情</text>
    </g>
    <text x="1280" y="43" class="small muted">操作顺序</text><text x="1280" y="74" class="body">武将 → 移动 → 动作 → 目标</text>
  </g>
</svg>
